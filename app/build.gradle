plugins {
    id "com.android.application"
}

// Release signing. Values come from environment variables (set as GitHub secrets in CI,
// or exported locally). If they are absent, assembleRelease produces an UNSIGNED apk
// and the CI verify step fails on purpose - a debug-signed "release" is never shipped.
def ksFile = System.getenv("NW_KEYSTORE_FILE")
def ksPass = System.getenv("NW_KEYSTORE_PASSWORD")
def keyAlias = System.getenv("NW_KEY_ALIAS")
def keyPass = System.getenv("NW_KEY_PASSWORD")
def hasReleaseKey = ksFile && ksPass && keyAlias && keyPass && file(ksFile).exists()

android {
    namespace "com.shimul.fiverrmessagealarm"
    compileSdk 34

    defaultConfig {
        applicationId "com.shimul.fiverrmessagealarm"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "3.0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias keyAlias
                keyPassword keyPass
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    lint {
        // Lint runs and reports, but does not block the build for style warnings.
        // The CI verify step (apksigner / aapt2) is the real release gate.
        abortOnError false
        checkReleaseBuilds true
    }
}

// No dependencies. The whole UI is built with android.widget / android.app classes
// so appcompat / material / constraintlayout were never referenced; removing them
// drops ~5 MB and all the transitive Kotlin / lifecycle / emoji2 / profileinstaller code.
dependencies {
}
