name: Build hardened release APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "8.9"
          cache-read-only: true

      - name: Lint and build hardened unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:lintRelease :app:assembleRelease --stacktrace

      - name: Stage Android signing verifier
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/

      - name: Upload unsigned release and verifier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Night-Watch-v2.1.0-secure-build
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/apksigner
            signing-tools/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
