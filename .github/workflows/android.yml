name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Read-only token: the workflow only needs to check out code and upload an artifact.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v4  (pinned to the commit that tag v4 pointed to on 2026-09-07)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # actions/setup-java v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle/actions/setup-gradle v3.5.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
        with:
          gradle-version: 8.9

      # Decode the release keystore from a repository secret.
      # See FIX-GUIDE.md for how to create the keystore and the 4 secrets.
      - name: Restore release keystore
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_B64 is not set. See FIX-GUIDE.md section 2."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "NW_KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace --no-daemon
        env:
          NW_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          NW_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          NW_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # Fail loudly if the APK is unsigned or debuggable instead of shipping it silently.
      - name: Verify APK is release-signed and non-debuggable
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::app-release.apk not found (signing config missing?)"; exit 1; }
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          if grep -q "Android Debug" certs.txt; then
            echo "::error::APK is signed with the Android Debug key"; exit 1
          fi
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::APK is debuggable"; exit 1
          fi

      # actions/upload-artifact v4
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NightWatch-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore/release.jks"
